name: Private Runtime CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-tests:
    name: Privacy tests and real sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GVAI_RUN_STAGING_SMOKE: "1"
      GVAI_RUN_RESOURCE_CONTAINMENT_TEST: "1"
      GVAI_PRIVATE_CGROUP_ROOT: /sys/fs/cgroup/gvai-private-runtime-ci
      PYTHONOPTIMIZE: "0"
      PYTEST_ADDOPTS: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install filesystem sandbox
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes bubblewrap
          fi
          bwrap --version

      - name: Install declared dependencies
        run: |
          python -m pip install \
            -r requirements.txt \
            -r requirements-dev.txt \
            -r gateway/requirements.txt
          python -m pip check

      - name: Report namespace policy diagnostics
        shell: bash
        run: |
          uname -sr
          id
          unshare --version
          python --version
          for policy in \
            /proc/sys/kernel/unprivileged_userns_clone \
            /proc/sys/kernel/apparmor_restrict_unprivileged_userns \
            /proc/sys/user/max_user_namespaces \
            /proc/sys/user/max_net_namespaces \
            /proc/self/attr/current \
            /proc/self/uid_map \
            /proc/self/gid_map \
            /sys/module/apparmor/parameters/enabled
          do
            printf '\n%s\n' "$policy"
            if [ -r "$policy" ]; then
              cat "$policy" || true
            else
              printf 'Unavailable or unreadable\n'
            fi
          done
          grep -E '^(NoNewPrivs|Seccomp|Seccomp_filters|CapInh|CapPrm|CapEff|CapBnd|CapAmb):' \
            /proc/self/status || true

      - name: Prepare delegated resource boundary
        shell: bash
        run: |
          set -euo pipefail

          parent=/sys/fs/cgroup
          root="$GVAI_PRIVATE_CGROUP_ROOT"

          if [ "$(stat -fc %T "$parent")" != "cgroup2fs" ]; then
            echo "cgroup v2 is required." >&2
            exit 1
          fi

          requested=()
          for controller in cpu memory pids; do
            if ! grep -qw "$controller" "$parent/cgroup.controllers"; then
              echo "Required cgroup controller is unavailable: $controller" >&2
              exit 1
            fi
            if ! grep -qw "$controller" "$parent/cgroup.subtree_control"; then
              requested+=("+$controller")
            fi
          done

          if [ "${#requested[@]}" -gt 0 ]; then
            printf '%s\n' "${requested[*]}" |
              sudo tee "$parent/cgroup.subtree_control" >/dev/null
          fi

          sudo install -d             -o "$(id -u)"             -g "$(id -g)"             -m 0700             "$root"

          test "$(stat -c %u "$root")" = "$(id -u)"
          test "$(stat -c %a "$root")" = "700"

          delegated=()
          for controller in cpu memory pids; do
            grep -qw "$controller" "$root/cgroup.controllers"
            if ! grep -qw "$controller" "$root/cgroup.subtree_control"; then
              delegated+=("+$controller")
            fi
          done

          if [ "${#delegated[@]}" -gt 0 ]; then
            printf '%s\n' "${delegated[*]}" |
              sudo tee "$root/cgroup.subtree_control" >/dev/null
          fi

          for controller in cpu memory pids; do
            grep -qw "$controller" "$root/cgroup.subtree_control"
          done

      - name: Install scoped CI user-namespace profile
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! command -v aa-exec >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes apparmor-utils
          fi

          profile_path=/tmp/gvai-private-runtime-ci.apparmor
          sudo tee "$profile_path" >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile gvai-private-runtime-ci flags=(unconfined) {
            userns,
          }
          EOF

          sudo apparmor_parser --replace "$profile_path"
          aa-exec -p gvai-private-runtime-ci -- \
            unshare --user --map-root-user -- \
            python -c 'print("Scoped user namespace passed")'

      - name: Verify real sandbox execution
        run: |
          aa-exec -p gvai-private-runtime-ci -- \
            timeout --kill-after=5s 15s \
              privacy/run_network_sandbox.sh \
              python -c 'print("Sandbox execution passed")'

      - name: Run privacy tests
        run: |
          # These three exclusions predate this workflow. Do not add new
          # exclusions to conceal regressions or unsupported isolation.
          aa-exec -p gvai-private-runtime-ci -- \
          timeout --kill-after=5s 180s python -m pytest -q \
            tests/test_staging_readiness.py \
            tests/test_resource_staging_launcher.py \
            tests/test_resource_containment.py \
            tests/test_encrypted_workspace.py \
            tests/integration/test_private_build_encrypted_workspace.py \
            tests/integration/test_private_runtime_staging_smoke.py \
            tests/integration/test_private_build_runtime.py \
            tests/integration/test_local_model_worker.py \
            tests/integration/test_llama_cpp_engine.py \
            tests/integration/test_private_build_network_boundary.py \
            tests/test_privacy_side_doors.py \
            --deselect=tests/integration/test_private_build_runtime.py::test_model_router_uses_network_isolated_private_worker \
            --deselect=tests/integration/test_private_build_runtime.py::test_model_router_keeps_external_path_when_private_mode_disabled \
            --deselect=tests/test_privacy_side_doors.py::test_model_router_blocked \
            --junitxml=privacy-test-results.xml

      - name: Reject skipped or missing smoke tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("privacy-test-results.xml").getroot()
          cases = list(root.iter("testcase"))
          required = {
              "test_real_encrypted_runtime_boundary",
              "test_real_cgroup_boundary_contains_and_kills_tree",
              "test_broker_stages_worker_inside_resource_boundary",
          }
          collected = [case.get("name") for case in cases]

          if not cases:
              raise SystemExit("No privacy tests were collected.")

          for name in sorted(required):
              if collected.count(name) != 1:
                  raise SystemExit(
                      f"Required containment test was not collected: {name}"
                  )

          if any(case.find("skipped") is not None for case in cases):
              raise SystemExit("Selected privacy tests must not be skipped.")

          print(
              "Required sandbox and containment tests ran; "
              "no selected tests were skipped."
          )
          PY

      - name: Verify and remove delegated resource boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          root="$GVAI_PRIVATE_CGROUP_ROOT"
          if [ ! -d "$root" ]; then
            exit 0
          fi

          children="$(
            find "$root"               -mindepth 1               -maxdepth 1               -type d               -print
          )"

          if [ -n "$children" ]; then
            echo "Leaked private-worker cgroups:" >&2
            printf '%s\n' "$children" >&2
            exit 1
          fi

          sudo rmdir "$root"

      - name: Remove scoped CI user-namespace profile
        if: always()
        run: |
          profile_path=/tmp/gvai-private-runtime-ci.apparmor
          if [ -f "$profile_path" ]; then
            sudo apparmor_parser --remove "$profile_path" || true
          fi
