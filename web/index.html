<!DOCTYPE html>
<html>
<head>
  <title>GvAI</title>
  <style>
    body { background:#0b1220; color:white; font-family:sans-serif; padding:20px; }
    input { width:300px; padding:8px; }
    button { padding:8px; }
    .sources { margin-top:10px; font-size:12px; opacity:0.7; }
  </style>
  <script src="/api_config.js?v=railway1"></script>
</head>
<body>

<h2>GvAI (Local)</h2>

<input id="msg" placeholder="Ask GvAI..." />
<button onclick="send()">Send</button>

<div id="answer" style="margin-top:20px;"></div>
<div id="sources" class="sources"></div>

<script>
async function send() {
  const msg = document.getElementById("msg").value;

  const res = await fetch((window.GVAI_API_BASE || "") + "/api/chat", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({message: msg})
  });

  const data = await res.json();

  document.getElementById("answer").innerText = data.response;

  document.getElementById("sources").innerText =
    "Sources: " + (data.sources || [])
      .map(s => s.source + "#" + s.chunk_id)
      .join(", ");
}
</script>

  <script src="./gv-runtime-ui.js?v=2"></script>
</body>
</html>
