<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GvAI</title>
  <link rel="stylesheet" href="./style.css?v=clean1" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">Gv</div>
      <div>
        <h1>GvAI</h1>
        <p>Chat-native survivability intelligence</p>
      </div>
    </div>
    <nav>
      <a href="./dashboard/">Dashboard</a>
      <a href="https://web-production-8e937.up.railway.app/api/health" target="_blank">API</a>
      <button id="clearBtn">Clear chat</button>
    </nav>
  </header>

  <main class="shell">
    <section class="hero">
      <h2>Talk to GvAI</h2>
      <p>Ask a question, test an idea, or push directly on the God Variable work.</p>
    </section>

    <section id="chat" class="chat">
      <div class="bubble gv">
        <span>GvAI</span>
        <p>I’m here. What do you want to work on today?</p>
      </div>
    </section>

    <section class="composer">
      <textarea id="prompt" placeholder="Message GvAI..."></textarea>
      <button id="voiceBtn" title="Talk to GvAI">🎙️</button>
      <button id="sendBtn">Send</button>
    </section>
  </main>

  <script>
    const API_BASE = "https://web-production-8e937.up.railway.app";
    const chat = document.getElementById("chat");
    const prompt = document.getElementById("prompt");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const voiceBtn = document.getElementById("voiceBtn");

    function addBubble(role, text, meta) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.innerHTML = `<span>${role === "you" ? "You" : "GvAI"}</span><p>${escapeHtml(text)}</p>${meta ? `<small>${escapeHtml(meta)}</small>` : ""}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
      }[m]));
    }

    function speak(text) {
      if (!("speechSynthesis" in window) || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95;
      u.pitch = 1;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    }

    async function sendMessage() {
      const message = prompt.value.trim();
      if (!message) return;

      prompt.value = "";
      addBubble("you", message);

      sendBtn.disabled = true;
      sendBtn.textContent = "Thinking...";

      try {
        const res = await fetch(`${API_BASE}/api/chat`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message})
        });

        const data = await res.json();
        const text = data.reply || data.response || data.message || data.error || "No response.";
        const meta = data.gv ? `Gv ${data.gv} • ${data.state || "UNKNOWN"} • ${data.decision || ""}` : "";

        addBubble("gv", text, meta);
        speak(text);
      } catch (err) {
        addBubble("gv", "Backend connection failed. Railway may be asleep or redeploying.");
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
        prompt.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    prompt.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    clearBtn.addEventListener("click", () => {
      chat.innerHTML = `<div class="bubble gv"><span>GvAI</span><p>I’m here. What do you want to work on today?</p></div>`;
    });

    // Voice input
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      voiceBtn.disabled = true;
      voiceBtn.title = "Voice input not supported in this browser";
    } else {
      const rec = new SR();
      rec.lang = "en-US";
      rec.interimResults = true;
      rec.continuous = false;
      let finalText = "";

      voiceBtn.addEventListener("click", () => {
        finalText = "";
        voiceBtn.textContent = "🛑";
        try { rec.start(); } catch { voiceBtn.textContent = "🎙️"; }
      });

      rec.onresult = event => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += t;
          else interim += t;
        }
        prompt.value = (finalText + interim).trim();
        prompt.focus();
      };

      rec.onend = () => {
        voiceBtn.textContent = "🎙️";
      };
    }
  </script>
</body>
</html>
