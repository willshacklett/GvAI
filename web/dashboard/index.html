<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GvAI Dashboard</title>
  <link rel="stylesheet" href="../style.css?v=dashboard1" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">Gv</div>
      <div>
        <h1>GvAI Dashboard</h1>
        <p>Live survivability telemetry</p>
      </div>
    </div>
    <nav>
      <a href="../">Chat</a>
      <a href="https://web-production-8e937.up.railway.app/api/health" target="_blank">API</a>
      <button id="refreshBtn">Refresh</button>
    </nav>
  </header>

  <main class="shell">
    <section class="hero">
      <h2>System Status</h2>
      <p id="statusLine">Checking GvAI runtime...</p>
    </section>

    <section class="grid">
      <div class="card">
        <span>Backend</span>
        <strong id="backend">UNKNOWN</strong>
      </div>
      <div class="card">
        <span>Gv Score</span>
        <strong id="gv">—</strong>
      </div>
      <div class="card">
        <span>State</span>
        <strong id="state">—</strong>
      </div>
      <div class="card">
        <span>Decision</span>
        <strong id="decision">—</strong>
      </div>
      <div class="card">
        <span>Drift Risk</span>
        <strong id="drift">—</strong>
      </div>
      <div class="card">
        <span>Irreversibility</span>
        <strong id="irreversible">—</strong>
      </div>
    </section>

    <section class="hero">
      <h2>Decision Trace</h2>
      <pre id="trace">Waiting for telemetry...</pre>
    </section>
  </main>

  <script>
    const API = "https://web-production-8e937.up.railway.app";

    async function refreshDashboard() {
      const statusLine = document.getElementById("statusLine");

      try {
        const health = await fetch(`${API}/api/health`).then(r => r.json());
        document.getElementById("backend").textContent = health.ok ? "ONLINE" : "DEGRADED";

        const res = await fetch(`${API}/api/chat`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message: "GV dashboard telemetry check. Return normal response."})
        });

        const data = await res.json();

        document.getElementById("gv").textContent = data.gv ?? data.gv_score ?? "—";
        document.getElementById("state").textContent = data.state ?? "—";
        document.getElementById("decision").textContent = data.decision ?? "—";
        document.getElementById("drift").textContent =
          data?.metrics?.drift_risk ?? data?.gv_state?.drift_risk ?? data.drift_risk ?? "—";
        document.getElementById("irreversible").textContent =
          data?.metrics?.irreversibility_risk ?? data?.gv_state?.irreversibility_risk ?? data.irreversibility_risk ?? "—";

        document.getElementById("trace").textContent = JSON.stringify(data, null, 2);
        statusLine.textContent = "GvAI telemetry is live.";
      } catch (err) {
        document.getElementById("backend").textContent = "OFFLINE";
        statusLine.textContent = "Telemetry failed. Backend may be asleep or redeploying.";
        document.getElementById("trace").textContent = String(err);
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", refreshDashboard);
    refreshDashboard();
  </script>
</body>
</html>
